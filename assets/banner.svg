<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Text & Accent Gradients -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .ambient-glow {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center;
    }
    .particle-1 { animation: floatParticle 7s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 9s ease-in-out infinite 2s; }
    .particle-3 { animation: floatParticle 11s ease-in-out infinite 4s; }
    .dynamic-flow {
      stroke-dasharray: 20, 10;
      animation: flowLine 15s linear infinite;
    }
    .floating-card {
      animation: gentleFloat 5s ease-in-out infinite;
    }
  </style>

  <!-- Deep Background Canvas -->
  <rect width="1200" height="420" fill="url(#bgGradient)" rx="16" />
  <rect width="1200" height="420" fill="url(#cyberGrid)" rx="16" />

  <!-- Dynamic Ambient Glow Spheres in Background (Behind text) -->
  <circle cx="200" cy="120" r="140" fill="#38bdf8" filter="url(#neonGlow)" class="ambient-glow" opacity="0.25" />
  <circle cx="1020" cy="300" r="160" fill="#a855f7" filter="url(#neonGlow)" class="ambient-glow" opacity="0.25" />
  <circle cx="600" cy="210" r="180" fill="#6366f1" filter="url(#neonGlow)" class="ambient-glow" opacity="0.15" />

  <!-- Dynamic Circuit / Memory Stream Flow Lines (Background) -->
  <g opacity="0.4" fill="none">
    <path d="M-50,80 C300,140 450,20 800,90 C1050,140 1150,60 1250,100" stroke="#38bdf8" stroke-width="2" class="dynamic-flow" />
    <path d="M-50,340 C250,280 500,390 850,320 C1050,270 1150,350 1250,330" stroke="#818cf8" stroke-width="2" class="dynamic-flow" style="animation-direction: reverse;" />
  </g>

  <!-- Dynamic Floating Nodes / Memory Particles (Background) -->
  <g fill="#38bdf8" opacity="0.6">
    <circle cx="150" cy="90" r="3.5" class="particle-1" />
    <circle cx="280" cy="330" r="4.5" class="particle-2" />
    <circle cx="980" cy="110" r="3" class="particle-3" />
    <circle cx="1070" cy="260" r="4" class="particle-1" />
    <circle cx="520" cy="60" r="2.5" class="particle-2" />
  </g>

  <!-- FOREGROUND CONTENT: Header Category Tag -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <rect x="-160" y="-18" width="320" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" filter="url(#softShadow)" />
    <circle cx="-135" cy="0" r="5" fill="#10b981" />
    <text x="-120" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">ENTERPRISE KNOWLEDGE ECOSYSTEM</text>
  </g>

  <!-- FOREGROUND CONTENT: Main Title (Crisp, High-Contrast, Foreground Layer) -->
  <g transform="translate(600, 160)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#titleGradient)" letter-spacing="-0.5" filter="url(#softShadow)">
      Enterprise Search &amp; Internal Memory Layers
    </text>
  </g>

  <!-- FOREGROUND CONTENT: Subtitle Description -->
  <g transform="translate(600, 215)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated Landscape of Permission-Aware Retrieval, Unified Corporate Memory &amp; Production RAG
    </text>
  </g>

  <!-- FOREGROUND CONTENT: Visual Feature Badges & Core Pillars -->
  <g transform="translate(600, 310)" text-anchor="middle" class="floating-card">
    <!-- Pillar 1: ACL Mirroring -->
    <g transform="translate(-360, 0)">
      <rect x="-105" y="-32" width="210" height="64" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2" filter="url(#softShadow)" />
      <rect x="-105" y="-32" width="210" height="64" rx="12" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
      <text x="0" y="-6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">🔐 Permission Mirroring</text>
      <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Zanzibar &amp; Source ACLs</text>
    </g>

    <!-- Pillar 2: Unified Memory & Connectors -->
    <g transform="translate(-120, 0)">
      <rect x="-105" y="-32" width="210" height="64" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2" filter="url(#softShadow)" />
      <rect x="-105" y="-32" width="210" height="64" rx="12" fill="none" stroke="#818cf8" stroke-width="1" stroke-opacity="0.3" />
      <text x="0" y="-6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">🧠 Internal Memory</text>
      <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">100+ Enterprise Connectors</text>
    </g>

    <!-- Pillar 3: Neural & Hybrid Retrieval -->
    <g transform="translate(120, 0)">
      <rect x="-105" y="-32" width="210" height="64" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2" filter="url(#softShadow)" />
      <rect x="-105" y="-32" width="210" height="64" rx="12" fill="none" stroke="#c084fc" stroke-width="1" stroke-opacity="0.3" />
      <text x="0" y="-6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">⚡ Hybrid RAG Retrieval</text>
      <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Dense + Sparse + Reranking</text>
    </g>

    <!-- Pillar 4: Open & Enterprise Ready -->
    <g transform="translate(360, 0)">
      <rect x="-105" y="-32" width="210" height="64" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2" filter="url(#softShadow)" />
      <rect x="-105" y="-32" width="210" height="64" rx="12" fill="none" stroke="#34d399" stroke-width="1" stroke-opacity="0.3" />
      <text x="0" y="-6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">🌐 Open Source &amp; SaaS</text>
      <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Audited &amp; Self-Hostable</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="100" y1="395" x2="1100" y2="395" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />
</svg>
